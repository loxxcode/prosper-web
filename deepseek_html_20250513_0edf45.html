// Toggle mobile menu
function toggleMenu() {
  const menu = document.getElementById('nav-menu');
  const hamburger = document.querySelector('.hamburger');
  
  if (menu.style.display === 'flex') {
    menu.style.display = 'none';
    hamburger.classList.remove('active');
  } else {
    menu.style.display = 'flex';
    menu.style.flexDirection = 'column';
    hamburger.classList.add('active');
  }
}

// Slideshow functionality
let slideIndex = 0;
let slideInterval;

function initializeSlideshow() {
  const slides = document.querySelectorAll('.slide');
  const indicators = document.querySelectorAll('.indicator');
  
  function showSlides() {
    slides.forEach(slide => slide.classList.remove('active'));
    indicators.forEach(indicator => indicator.classList.remove('active'));
    
    slideIndex++;
    if (slideIndex >= slides.length) slideIndex = 0;
    
    slides[slideIndex].classList.add('active');
    indicators[slideIndex].classList.add('active');
  }
  
  // Start automatic slideshow
  slideInterval = setInterval(showSlides, 5000);
  
  // Manual slide controls
  window.plusSlides = function(n) {
    clearInterval(slideInterval);
    slideIndex += n;
    if (slideIndex >= slides.length) slideIndex = 0;
    else if (slideIndex < 0) slideIndex = slides.length - 1;
    updateSlides();
    slideInterval = setInterval(showSlides, 5000);
  };
  
  window.goToSlide = function(n) {
    clearInterval(slideInterval);
    slideIndex = n;
    updateSlides();
    slideInterval = setInterval(showSlides, 5000);
  };
  
  function updateSlides() {
    slides.forEach(slide => slide.classList.remove('active'));
    indicators.forEach(indicator => indicator.classList.remove('active'));
    slides[slideIndex].classList.add('active');
    indicators[slideIndex].classList.add('active');
  }
  
  // Initialize first slide
  updateSlides();
}

// Chat functionality
function openChat() {
  document.getElementById('chat-window').style.display = 'flex';
}

function closeChat() {
  document.getElementById('chat-window').style.display = 'none';
}

function startChat() {
  const name = document.getElementById('chat-name').value.trim();
  const email = document.getElementById('chat-email').value.trim();

  if (name && email) {
    if (/^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/.test(email)) {
      document.getElementById('chat-form').style.display = 'none';
      document.getElementById('chat-content').style.display = 'flex';
      document.getElementById('chat-messages').innerHTML = 
        `<div><strong>System:</strong> Welcome, ${name}! How can we help you today?</div>`;
    } else {
      alert('Please enter a valid email address.');
    }
  } else {
    alert('Please enter your name and email.');
  }
}

function sendMessage(event) {
  if (event.key === 'Enter') {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (message) {
      const chatMessages = document.getElementById('chat-messages');
      const name = document.getElementById('chat-name').value.trim();
      
      // User message
      const userMessage = document.createElement('div');
      userMessage.innerHTML = `<strong>${name}:</strong> ${message}`;
      chatMessages.appendChild(userMessage);
      
      // Auto-reply (simulated)
      setTimeout(() => {
        const botMessage = document.createElement('div');
        botMessage.innerHTML = '<strong>Support:</strong> Thank you for your message. Our team will respond shortly.';
        chatMessages.appendChild(botMessage);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 1000);
      
      input.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  }
}

  alert(`Language switched to ${lang === 'en' ? 'English' : 'Kinyarwanda'}. Actual implementation would load translations.`);

// Typing animation for mission/vision text
function initializeTypingAnimations() {
  const typingElements = [
    {
      id: "typing-text",
      text: "Our Vision is to Empower a connected world through innovative Technology Solutions that drive Efficiency, inspire Creativity and transform visibility of our Clients in today's growing digital world.",
      container: document.querySelector(".mission-section .typing-container")
    },
    {
      id: "typing-text-mission",
      text: "Our mission is to empower businesses with cutting-edge technology and creative designs that drive growth and enhance online presence. Whether you need robust IT support, stunning graphics, a user-friendly website, or effective digital marketing strategies, we are here to make it happen.",
      container: document.querySelector(".values-container .typing-container")
    }
  ];

  typingElements.forEach(element => {
    if (element.container) {
      const typingEl = document.createElement("span");
      typingEl.id = element.id;
      const cursorEl = document.createElement("span");
      cursorEl.className = "cursor";
      cursorEl.textContent = "|";
      
      element.container.insertBefore(typingEl, element.container.firstChild);
      element.container.appendChild(cursorEl);
      
      let index = 0;
      function type() {
        if (index < element.text.length) {
          typingEl.textContent += element.text.charAt(index);
          index++;
          setTimeout(type, 50);
        }
      }
      type();
    }
  });
}

// Initialize everything when DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
  initializeSlideshow();
  initializeTypingAnimations();
  
  // Close menu when clicking on a link (for mobile)
  document.querySelectorAll('#nav-menu a').forEach(link => {
    link.addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        toggleMenu();
      }
    });
  });
});

// Close chat when clicking outside
document.addEventListener('click', function(event) {
  const chatWindow = document.getElementById('chat-window');
  const chatButton = document.querySelector('.chat-button');
  
  if (chatWindow.style.display === 'flex' && 
      !chatWindow.contains(event.target) && 
      event.target !== chatButton) {
    closeChat();
  }
});
